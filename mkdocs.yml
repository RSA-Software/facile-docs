site_name: Manuale Facile
site_description: Manuale utente del gestionale Facile — guida operativa maschera per maschera
site_author: R.S.A. S.a.s. di Capizzi, Furnari & C.
site_url: https://rsa-software.github.io/facile-docs/   # <-- sostituire con il dominio definitivo
copyright: © R.S.A. S.a.s. — Tutti i diritti riservati

# ---------------------------------------------------------------------------
# Repository (mostra il link "Modifica questa pagina" su ogni documento)
# ---------------------------------------------------------------------------
repo_url: https://github.com/RSA-software/facile-docs
repo_name: RSA-Software/facile-docs
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

# ---------------------------------------------------------------------------
# Tema
# ---------------------------------------------------------------------------
theme:
  name: material
  language: it
  logo: assets/img/logo.png
  favicon: assets/img/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Passa al tema scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Passa al tema chiaro
  features:
    - navigation.instant        # navigazione senza ricaricare la pagina
    - navigation.tracking
    - navigation.tabs           # moduli come schede in alto
    - navigation.sections
    - navigation.top
    - navigation.indexes        # index.md come pagina della sezione
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.code.copy
    - content.tooltips

extra_css:
  - assets/css/extra.css

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://www.rsasoftware.it
      name: rsasoftware.it
  # Selettore di versione del manuale (attivo quando si pubblica con `mike`)
  # version:
  #   provider: mike
  #   default: stabile

# ---------------------------------------------------------------------------
# Plugin
# ---------------------------------------------------------------------------
plugins:
  - search:
      lang: it
      separator: '[\s\-\.]+'
  # - glightbox        # zoom sugli screenshot (pip install mkdocs-glightbox)
  # - mike             # versionamento del manuale (pip install mike)

# ---------------------------------------------------------------------------
# Estensioni Markdown
# ---------------------------------------------------------------------------
markdown_extensions:
  - abbr
  - admonition          # blocchi Nota / Attenzione / Suggerimento
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: In questa pagina
  - pymdownx.details    # blocchi richiudibili
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys       # rende i tasti come F2 in stile tastiera
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# ---------------------------------------------------------------------------
# Struttura del manuale
#
# La navigazione ricalca il menu di Facile, voce per voce e nello stesso
# ordine: chi conosce il programma trova la pagina dov'è la maschera. Il
# riferimento è il menu completo (IDR_PROFESSIONAL); nelle licenze Standard e
# Lite alcune voci non compaiono.
#
# UNICA ECCEZIONE: il ramo "Analisi Dati" non esiste in IDR_PROFESSIONAL — è
# solo di Facile Evolution (IDR_MAINFRAME, fra Magazzino e Scadenze). Il
# controllo di copertura su quel ramo va fatto su IDR_MAINFRAME.
#
# Le etichette qui sotto sono quelle del menu, non i titoli delle pagine.
# Aggiungere ogni nuova maschera nella posizione che ha nel menu.
# ---------------------------------------------------------------------------

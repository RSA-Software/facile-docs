# Cosa coprire negli screenshot del manuale.
#
# Il riconoscimento e' per ETICHETTA, cioe' per la scritta che il lettore vede
# accanto al campo. Non per numero di controllo: in Facile lo stesso numero
# ricompare in maschere diverse con nomi diversi — l'id 295 e' insieme
# IDC_CLI_D_START e IDC_CLI_FIRST_VAL2 — quindi una regola sui nomi copre cose
# a caso (era cosi' che "Data Iniziale" finiva sfocata).
#
# Il confronto ignora maiuscole, accenti, spazi e punteggiatura: scrivere
# "Rag. Sociale 1/Cognome" o "ragsociale1cognome" e' lo stesso. Si puo' usare *.

etichette_sensibili:
  # ragioni sociali, cognomi e nomi
  - "rag*cognome"          # Rag. Sociale 1/Cognome
  - "rag*nome"             # Rag. Sociale 2/ Nome
  - "nome"                 # Nome da solo (Destinazioni diverse, titolare)
  - "ragionesociale*"
  - "cognome*"
  - "nominativo*"
  - "intestazione*"
  - "dacliente"
  - "acliente"
  - "dafornitore"
  - "afornitore"
  - "cliente"
  - "fornitore"
  # identificativi fiscali
  - "piva*"
  - "partitaiva*"
  - "codfiscale*"
  - "codicefiscale*"
  # recapiti
  - "telefono*"
  - "telefoni*"
  - "cellulare*"
  - "cellulari*"
  - "fax"
  - "email"
  - "emai*"
  - "pec"
  - "indirizzo*"
  - "sitoweb"
  # coordinate bancarie (Banche, Clienti, Fornitori, Ditte): nella schermata di
  # Banche del 09/09/2026 un IBAN vero era rimasto leggibile
  - "*iban*"
  - "numconto"
  - "nunconto"             # didascalia storica con il refuso "Nun. Conto"
  # date di nascita
  - "datanascita"
  - "data*nascita"
  - "nato*"
  - "compleanno*"

# Etichette che contengono una parola sensibile ma non un dato personale.
etichette_escluse:
  - "tipocliente"
  - "tipofornitore"
  - "flagfatturato"
  - "statoattivita"
  - "gruppoclienti"
  - "gruppofornitori"

# Sotto questa larghezza (pixel) un campo e' il codice accanto alla
# descrizione: contiene un numero, non un nome, e coprirlo sporca e basta.
larghezza_minima: 70

# --- griglie ---------------------------------------------------------------
# Sono un unico controllo disegnato (FarPoint Spread): le celle non esistono
# come finestre. Si copre la colonna intera, individuata dall'intestazione
# letta a video con Tesseract. Senza Tesseract servono le frazioni a mano,
# sotto in per_maschera.
classi_griglia:
  - SPR32A80
  - SysListView32

colonne_sensibili:
  - "cliente*"
  - "fornitore*"
  - "cognome*"
  - "nome*"
  - "rag*"
  - "intestazione*"
  - "telefono*"
  - "telefoni*"
  - "cellulare*"
  - "cellulari*"
  - "email*"
  - "pec"
  - "indirizzo*"
  - "compleanno*"
  - "nascita*"
  - "piva*"
  - "codfiscale*"
  - "*iban*"

# --- barra del titolo -------------------------------------------------------
# Diverse maschere attaccano al titolo un dato del cliente dopo un separatore
# ("SAL Subappaltatore - <ragione sociale>"): la barra non e' un controllo e
# nessuna delle regole qui sopra la vedeva. Si copre cio' che segue il
# separatore; la didascalia fissa resta leggibile. Elenco vuoto = spento.
titolo_separatori:
  - " - "

# --- eccezioni per singola maschera ----------------------------------------
per_maschera:
  # La descrizione di una commessa e' il nome del lavoro, e quello del cliente
  # si legge dentro; "Tecnico" e' una persona. Nessuna delle due e' sensibile
  # come etichetta generica, quindi valgono solo qui.
  IDD_TCN_COMMESSE:
    aggiungi_etichette: ["descrizione", "tecnico", "contratto"]

  # Dati per l'Agenzia delle Dogane (versione Energy): il codice ditta e' una
  # partita IVA con il prefisso del paese, accisa e targa identificano
  # l'operatore e il suo mezzo.
  IDD_TBC_DOGANE:
    aggiungi_etichette: ["codditta", "codaccisa", "targa"]
  IDD_CLI_DOGANE:
    aggiungi_etichette: ["codditta", "codaccisa", "targa"]

  # La descrizione di un operatore e' il nome e cognome di chi sta alla cassa,
  # e la tessera e' il suo badge (29/09/2026: la schermata usciva in chiaro).
  IDD_TBC_OPERATORI:
    aggiungi_etichette: ["descrizione", "tessera"]

  # Un trasportatore puo' essere una persona fisica: la citta' completa
  # l'indirizzo, targa e numero d'albo identificano lui e il suo mezzo.
  IDD_TBC_VETTORI:
    aggiungi_etichette: ["citta", "targa", "nalbo"]

  # Piano dei conti: la descrizione di un sottoconto e' spesso il conto
  # corrente con il suo numero ("UNICREDIT 106752986", "POSTEPAY 1746"), o il
  # nome di una societa' collegata. Nella Riclassificazione Conti e nell'elenco
  # dei sottoconti e' una colonna della griglia; nella scheda del sottoconto
  # e' un campo, che ha la stessa etichetta del mastro e del conto e li copre
  # tutti e tre (30/09/2026: l'elenco dei sottoconti usciva in chiaro).
  IDD_TCN_RICLASSIFICA:
    aggiungi_colonne: ["descrizione"]
  IDD_TCN_SOTTOCONTI_BR:
    aggiungi_colonne: ["descrizione"]
  IDD_TCN_SOTTOCON:
    aggiungi_etichette: ["descrizione"]

  # IDD_CLI_COMPLEANNI:
  #   # colonne come frazioni della larghezza della griglia, da sinistra
  #   colonne: [[0.22, 0.52], [0.52, 0.62], [0.62, 0.86]]
  #   aggiungi_etichette: ["riferimento"]
  #   aggiungi_colonne: ["note"]       # intestazioni di griglia, lette con l'OCR
  #   escludi_etichette: ["citta"]
  #   larghezza_minima: 90

# Vecchio motore per nome di controllo: tenuto ma spento, vedi sopra.
usa_nomi_controllo: false
per_nome_controllo: []

;File di configurazione per il tipo cassa "RCH WEB SERVICE"
;Registratori telematici RCH PRINT!F RT comandati in rete col web service della
;cassa (protocollo standard RCH dentro XML su HTTP), senza il programma
;Multidriver e senza altri programmi da installare.
;
;Sul registratore, in SERVICE, menu Connettivita', Ethernet:
;  Protocollo PC       = STANDARD
;  WEBSRV: Risp. estesa = SI
;Senza la risposta estesa la cassa non riporta il numero del documento, la
;chiusura e lo stato: Facile lo segnala e non emette lo scontrino.
;
;Nelle Impostazioni la Porta della cassa va lasciata a un valore diverso da
;zero (per esempio LAN): non si usa, ma con zero la vendita non parte. Per il
;display della cassa (tipo display "RCH WEB SERVICE") la Porta del display deve
;essere la stessa della cassa.

[OPTIONS]

;Indirizzo IP del registratore e porta del suo web server (80).
ip   = 192.168.1.100
port = 80

;Colonne della prima riga di vendita e delle righe di messaggio aggiuntive
COL_PRIMA_RIGA = 35
COL_RIGHE_AGG  = 25

;
;Indici delle forme di pagamento, cioe' il numero che finisce nel comando
;"=T<n>" del protocollo.
;
;I valori qui sotto sono i default XML7 di fabbrica (firmware 8.0.0 e oltre):
;  1 contanti          5 tickets                 9 sconto a pagare
;  2 non riscosso beni 6 non riscosso servizi    10 buoni multiuso
;  3 assegni           7 NR seguira' fattura     11 buoni celiachia
;  4 pag. elettronico  8 non riscosso DCR SSN
;NON sono quelli di cfg\RCH_Multidriver.ini, che dalla sesta voce in avanti
;tiene per compatibilita' i numeri storici.
;
;ATTENZIONE: la tabella delle forme di pagamento del registratore e'
;riprogrammabile, quindi questi numeri vanno verificati sul dump
;programmazioni della cassa installata. Un pagamento registrato sulla forma
;sbagliata NON da' errore: lo si scopre in chiusura, sui totalizzatori.
;
;Print!F gestisce da 1 a 30 forme. Un indice a 0 disabilita quella forma di
;pagamento.
;
[PAGAMENTI]
contante             = 1
non_riscosso_beni    = 2
assegni              = 3
elettronico          = 4
tickets              = 5
non_riscosso_servizi = 6
non_riscosso_fattura = 7
non_riscosso_ssn     = 8
sconto_a_pagare      = 9
buoni_multiuso       = 10
buoni_celiachia      = 11

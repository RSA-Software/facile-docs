;File di configurazione per il tipo cassa "CUSTOM WEB SERVICE"
;Registratori telematici Custom di 3a generazione (JSmart RT, Big Plus RT,
;K3-F RT, Q3X-F RT, KubeX-F RT, VKP80III-F RT, P3-N RT, Fusion, Edge-N)
;comandati in rete col web service XML della cassa, senza altri programmi da
;installare.
;
;VERSIONE BETA: il collegamento e' scritto sul manuale del costruttore e non e'
;ancora stato provato su un registratore. Va collaudato sulla cassa prima di
;usarlo da un cliente.
;
;Sul registratore il collegamento col PC deve essere impostato sul protocollo
;XML (web service) e la cassa deve essere in modalita' FPU: con un'altra
;impostazione la cassa risponde con l'errore 219 (protocollo errato) o 220
;(modalita' errata), e Facile lo segnala.
;
;Nelle Impostazioni la Porta della cassa va lasciata a un valore diverso da
;zero (per esempio LAN): non si usa, ma con zero la vendita non parte. Per il
;display della cassa (tipo display "CUSTOM WEB SERVICE") la Porta del display
;deve essere la stessa della cassa.
;
;La matricola delle Impostazioni viene mandata alla cassa come utente e
;password (accesso al web service); dopo la prima lettura riuscita vale la
;matricola letta dalla cassa.

[OPTIONS]

;Indirizzo IP del registratore e porta del suo web server (80).
ip   = 192.168.1.100
port = 80

;Colonne della descrizione nella riga di vendita (il manuale del web service
;ne garantisce 22, il protocollo ne accetta fino a 44) e delle righe
;aggiuntive con il resto della descrizione (al massimo 42).
COL_PRIMA_RIGA = 22
COL_RIGHE_AGG  = 32

;
;Tipi di pagamento, cioe' il numero che finisce nell'attributo paymentType del
;comando printRecTotal.
;
;I valori qui sotto sono quelli di fabbrica (comando 3007 del protocollo
;Custom):
;  1 contanti            5 ticket (buoni pasto)    50 non riscosso servizi
;  2 assegni             6 sospeso                 51 non riscosso fatture
;  3 carta di credito    7 non riscosso beni       52 non riscosso DCR a SSN
;  4 generico            8 carta di debito         53 sconto a pagare
;
;I buoni multiuso e i buoni celiachia non hanno una voce loro nella tabella
;di fabbrica: vanno su sconto a pagare (53) e su ticket (5), come nel tipo
;cassa CUSTOM.
;
;ATTENZIONE: la tabella dei pagamenti del registratore e' riprogrammabile (da
;1 a 30, piu' le forme da 50 a 53), quindi questi numeri vanno verificati
;sulla programmazione della cassa installata. Un pagamento registrato sul
;tipo sbagliato NON da' errore: lo si scopre in chiusura, sui totalizzatori.
;
;Un valore a 0 disabilita quella forma di pagamento: Facile la rifiuta invece
;di mandarla alla cassa.
[PAGAMENTI]
contante             = 1
assegni              = 2
carta_credito        = 3
bancomat             = 8
tickets              = 5
non_riscosso_beni    = 7
non_riscosso_servizi = 50
non_riscosso_fattura = 51
non_riscosso_ssn     = 52
sconto_a_pagare      = 53
buoni_multiuso       = 53
buoni_celiachia      = 5

; Buoni sconto - file di configurazione (modello commentato)
;
; Dove metterlo: nella cartella cfg del programma, con uno di questi nomi:
;   buoni_sconto_<codice ditta a 5 cifre>.ini   solo per quella ditta
;                                               (ad esempio buoni_sconto_00001.ini)
;   buoni_sconto.ini                            per tutte le ditte che non hanno
;                                               un file proprio
; Il programma cerca prima il file della ditta, poi quello generico.
;
; ATTENZIONE: salvare il file in ANSI (Windows-1252), non in UTF-8: un file
; salvato in UTF-8 con BOM non viene letto e il buono non esce. In Blocco note
; si sceglie "ANSI" nel campo Codifica di "Salva con nome".
;
; Le righe che iniziano con ; sono commenti. Le date si scrivono gg/mm/aaaa.
; Una data scritta male non viene ignorata: è un errore, e il buono non esce.
;
; Questo modello è l'esempio di una promozione natalizia: buono del 10% del
; totale dello scontrino a chi spende almeno 50 euro, emesso dall'1 al 24
; dicembre 2026, spendibile fino al 31 gennaio 2027.
[OPTIONS]

; ---------------------------------------------------------------------------
; Tipo di buono
;   tipo = valore       buono_n è un importo in euro (predefinito)
;   tipo = percentuale  buono_n è una percentuale (maggiore di 0, al più 100)
;                       del totale dello scontrino. Il buono vale il totale
;                       per la percentuale, arrotondato al centesimo, ed esce
;                       sempre un solo buono. Il buono che esce è comunque un
;                       buono a valore: la percentuale serve solo a calcolarlo.
; ---------------------------------------------------------------------------
tipo		= percentuale

; ---------------------------------------------------------------------------
; Periodo di emissione (facoltativo): il buono esce solo se oggi è compreso
; fra le due date, estremi compresi. Una data vuota o assente lascia il
; periodo aperto da quella parte. Fuori dal periodo non esce nessun buono e
; non compare nessun messaggio.
; ---------------------------------------------------------------------------
emissione_dal	= 01/12/2026
emissione_al	= 24/12/2026

; ---------------------------------------------------------------------------
; Validità del buono emesso. Serve una delle due forme.
;
; Fissa: il buono vale dal giorno validita_dal al giorno validita_al. Vanno
; scritte tutte e due, con validita_al non prima di validita_dal.
; ---------------------------------------------------------------------------
validita_dal	= 01/12/2026
validita_al	= 31/01/2027

; Relativa (usata solo se la fissa manca o è incompleta):
;   dal = oggi + validita_dopo_giorni
;   al  = dal + validita_durata_giorni
; Esempio: buono che vale da domani per 30 giorni.
;validita_dopo_giorni	= 1
;validita_durata_giorni	= 30

; ---------------------------------------------------------------------------
; Buoni multipli (solo con tipo = valore). N è quante volte la spesa della
; fascia sta nel totale dello scontrino.
;   multipli = 1  escono N buoni, ciascuno del valore della fascia
;   multipli = 0  esce un solo buono da N volte il valore della fascia
; Con tipo = percentuale la chiave è ignorata: esce sempre un solo buono.
; ---------------------------------------------------------------------------
multipli	= 0

; ---------------------------------------------------------------------------
; Larghezza in colonne del formato di stampa 3 (Personalizzato da file), da
; 1 a 45. Gli altri formati hanno la larghezza fissa.
; ---------------------------------------------------------------------------
colonne		= 45

; ---------------------------------------------------------------------------
; Righe in testa al buono, da header_1 a header_5, al massimo 45 caratteri
; ciascuna. Nel formato 3 sono le righe sopra il codice a barre.
;
; In header e footer si possono usare questi segnaposti:
;   {VALORE}  il valore del buono, ad esempio 5,56 EURO
;   {DAL}     il primo giorno di validità (gg/mm/aaaa)
;   {AL}      l'ultimo giorno di validità (gg/mm/aaaa)
; ---------------------------------------------------------------------------
header_1	= BUONO SCONTO
header_2	= PER TE {VALORE}
header_3	=
header_4	=
header_5	=

; ---------------------------------------------------------------------------
; Fasce, fino a 5. Con una spesa di almeno spesa_n si ottiene buono_n (un
; importo in euro, o una percentuale se tipo = percentuale). Se il totale
; raggiunge più fasce vale quella con la spesa più alta. Una fascia conta
; solo se spesa_n e buono_n sono tutti e due maggiori di zero.
;
; Qui una fascia sola: 10% a chi spende 50 euro o più.
; ---------------------------------------------------------------------------
spesa_1		= 50
buono_1		= 10
spesa_2		=
buono_2		=
spesa_3		=
buono_3		=
spesa_4		=
buono_4		=
spesa_5		=
buono_5		=

; Esempio a fasce con tipo = valore:
;tipo		= valore
;spesa_1	= 25
;buono_1	= 5
;spesa_2	= 50
;buono_2	= 12
;spesa_3	= 100
;buono_3	= 30

; ---------------------------------------------------------------------------
; Righe in coda al buono per la fascia scelta: footer_<fascia>_<riga>, con la
; fascia da 1 a 5 e la riga da 1 a 5, al massimo 45 caratteri ciascuna. Nel
; formato 3 sono le righe sotto il codice a barre.
; ---------------------------------------------------------------------------
footer_1_1	= Buono di {VALORE} sulla prossima spesa
footer_1_2	= Valido dal {DAL} al {AL}
footer_1_3	= Non cumulabile con altre promozioni
footer_1_4	=
footer_1_5	=

; ---------------------------------------------------------------------------
; Righe in coda comuni: usate per le fasce che non hanno nessuna riga
; footer_<fascia>_<riga>.
; ---------------------------------------------------------------------------
footer_1	=
footer_2	=
footer_3	=
footer_4	=
footer_5	=

; ---------------------------------------------------------------------------
; Compatibilità con i file vecchi: se validita_dal e validita_al mancano si
; leggono le chiavi start_year, start_month, start_day (inizio) e stop_year,
; stop_month, stop_day (fine).
; ---------------------------------------------------------------------------
;start_year	= 2026
;start_month	= 12
;start_day	= 1
;stop_year	= 2027
;stop_month	= 1
;stop_day	= 31

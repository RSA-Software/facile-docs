;File di configurazione per stampante fiscale RCH
;per funzionamento conprotocollo RCH MULTIDRIVER
; 
;ESEMPIO CONFIGURAZIONE SU PORTA SERIALE
;SERIAL      = 1
;SERIALCONF  = 9600,N,8,1
;PATH_EXE    = C:\Program Files\Multidriver\MULTIDRIVER_APP.exe
;PATH_IN     = C:\RCH\IN
;PATH_OUT   = C:\RCH\OUT
;
;ESEMPIO CONFIGURAZIONE SU PORTA USB
;USB         = USB
;PATH_EXE    = C:\Program Files\Multidriver\MULTIDRIVER_APP.exe
;PATH_IN     = C:\RCH\IN
;PATH_OUT   = C:\RCH\OUT
;
;ESEMPIO CONFIGURAZIONE SU LAN
;IP       = 192.168.1.197
;TCPPORT  = 9150
;PATH_EXE = C:\Program Files\Multidriver\MULTIDRIVER_APP.exe
;PATH_IN  = C:\RCH\IN
;PATH_OUT = C:\RCH\OUT

;
;ATTENZIONE: PATH_IN e PATH_OUT devono essere gli stessi impostati nel file
;Multidriver.ini del driver (cartella di installazione del Multidriver).
;PATH_OUT ora viene letto davvero: e' da li' che si prende scontrino.out, il
;file con cui il driver dice se lo scontrino e' stato stampato, e Paper.out
;per il fine carta. Se i due percorsi non coincidono l' esito non si legge e
;un errore del registratore passa inosservato come prima.
;Se PATH_OUT manca si ripiega su PATH_IN.
;
[OPTIONS]
IP       = 192.168.1.55
TCPPORT  = 23
PATH_EXE = "C:\Program Files (x86)\Multidriver\MULTIDRIVER_APP.exe"
PATH_IN  = C:\RCH\IN
PATH_OUT = C:\RCH\OUT
COL_PRIMA_RIGA = 35
COL_RIGHE_AGG  = 25

;--------------------------------------------------------------------------
;OPZIONE FIDELITY del registratore
;--------------------------------------------------------------------------
;Nonostante il nome non gestisce tessere ne' punti, che restano di Facile:
;decide solo se dopo il pagamento la cassa aspetta altre righe prima di
;chiudere lo scontrino. Serve per stampare il codice a barre dello scontrino
;(quello dei resi) in fondo allo scontrino stesso.
;
;Come si accende sulla cassa (Print!F RT, manuale tecnico RCH par. 4.6):
;  5 [CHIAVE], 555 [CONTANTI]        entra in SERVICE (555 = password di fabbrica)
;  [PREZZO REPARTO] piu' volte       fino a OPZIONE FIDELITY, poi [CONTANTI]
;  OPZIONE FIDELITY ?  [REPARTO]     sceglie SI (di fabbrica e' NO), poi [CONTANTI]
;  [STORNO], poi 1 [CHIAVE]          esce dal menu e torna in registrazione
;Per spegnerla si rifa' lo stesso giro scegliendo NO.
;
;Valori. Con questo collegamento Facile non puo' chiedere alla cassa se
;l'opzione e' accesa: il valore qui sotto DEVE corrispondere alla cassa.
;  1 = opzione ACCESA sulla cassa. Dopo il pagamento Facile stampa il codice a
;      barre in fondo allo scontrino e manda la chiusura che la cassa aspetta.
;  0 = opzione SPENTA sulla cassa (come esce di fabbrica). Il codice a barre
;      esce su un documento non fiscale subito dopo lo scontrino.
;Se il valore non corrisponde alla cassa:
;  1 con l'opzione spenta: la cassa rifiuta i comandi mandati dopo il
;    pagamento (lo scontrino e' comunque emesso);
;  0 con l'opzione accesa: Facile non manda la chiusura; sulla Print!F RT la
;    carta viene tagliata subito dopo il pagamento e la parte finale
;    (matricola, azzeramento, numero) resta dentro la stampante senza taglio:
;    si vede solo facendo avanzare la carta.
;Dopo aver acceso o spento l'opzione sulla cassa, cambiare questo valore e
;riaprire il Pos di Facile.
fidelity = 0

;
;Indici delle forme di pagamento, cioe' il numero che finisce nel comando
;"=T<n>" del protocollo. I valori qui sotto sono quelli che prima stavano
;scritti nel codice: lasciandoli come sono il comportamento non cambia.
;
;ATTENZIONE: la tabella delle forme di pagamento del registratore e'
;riprogrammabile (comandi ">T<n>/?A/..." in modalita' PRG), quindi questi
;numeri vanno verificati sul dump programmazioni della cassa installata. Un
;pagamento registrato sulla forma sbagliata NON da' errore: lo si scopre in
;chiusura, sui totalizzatori.
;
;I default XML7 di fabbrica (firmware 8.0.0 e oltre) sono invece:
;  1 contanti          5 tickets                 9 sconto a pagare
;  2 non riscosso beni 6 non riscosso servizi    10 buoni multiuso
;  3 assegni           7 NR seguira' fattura     11 buoni celiachia
;  4 pag. elettronico  8 non riscosso DCR SSN
;dalla sesta voce in avanti non coincidono con i valori sotto.
;
;Print!F gestisce da 1 a 30 forme, Print! 3.0 RT solo da 1 a 11.
;Un indice a 0 disabilita quella forma di pagamento.
;
[PAGAMENTI]
contante             = 1
non_riscosso_beni    = 2
assegni              = 3
elettronico          = 4
tickets              = 5
buoni_celiachia      = 6
non_riscosso_servizi = 7
non_riscosso_fattura = 8
non_riscosso_ssn     = 9
sconto_a_pagare      = 10
buoni_multiuso       = 11
;File di configurazione per stampante fiscale RCH
;per funzionamento conprotocollo RCH MULTIDRIVER
; 
;ESEMPIO CONFIGURAZIONE SU PORTA SERIALE
;SERIAL      = 1
;SERIALCONF  = 9600,N,8,1
;PATH_EXE    = C:\Program Files\Multidriver\MULTIDRIVER_APP.exe
;PATH_IN     = C:\RCH\IN
;PATH_OUT   = C:\RCH\OUT
;
;ESEMPIO CONFIGURAZIONE SU PORTA USB
;USB         = USB
;PATH_EXE    = C:\Program Files\Multidriver\MULTIDRIVER_APP.exe
;PATH_IN     = C:\RCH\IN
;PATH_OUT   = C:\RCH\OUT
;
;ESEMPIO CONFIGURAZIONE SU LAN
;IP       = 192.168.1.197
;TCPPORT  = 9150
;PATH_EXE = C:\Program Files\Multidriver\MULTIDRIVER_APP.exe
;PATH_IN  = C:\RCH\IN
;PATH_OUT = C:\RCH\OUT

;
;ATTENZIONE: PATH_IN e PATH_OUT devono essere gli stessi impostati nel file
;Multidriver.ini del driver (cartella di installazione del Multidriver).
;PATH_OUT ora viene letto davvero: e' da li' che si prende scontrino.out, il
;file con cui il driver dice se lo scontrino e' stato stampato, e Paper.out
;per il fine carta. Se i due percorsi non coincidono l' esito non si legge e
;un errore del registratore passa inosservato come prima.
;Se PATH_OUT manca si ripiega su PATH_IN.
;
[OPTIONS]
IP       = 192.168.1.55
TCPPORT  = 23
PATH_EXE = "C:\Program Files (x86)\Multidriver\MULTIDRIVER_APP.exe"
PATH_IN  = C:\RCH\IN
PATH_OUT = C:\RCH\OUT
COL_PRIMA_RIGA = 35
COL_RIGHE_AGG  = 25

;
;Indici delle forme di pagamento, cioe' il numero che finisce nel comando
;"=T<n>" del protocollo. I valori qui sotto sono quelli che prima stavano
;scritti nel codice: lasciandoli come sono il comportamento non cambia.
;
;ATTENZIONE: la tabella delle forme di pagamento del registratore e'
;riprogrammabile (comandi ">T<n>/?A/..." in modalita' PRG), quindi questi
;numeri vanno verificati sul dump programmazioni della cassa installata. Un
;pagamento registrato sulla forma sbagliata NON da' errore: lo si scopre in
;chiusura, sui totalizzatori.
;
;I default XML7 di fabbrica (firmware 8.0.0 e oltre) sono invece:
;  1 contanti          5 tickets                 9 sconto a pagare
;  2 non riscosso beni 6 non riscosso servizi    10 buoni multiuso
;  3 assegni           7 NR seguira' fattura     11 buoni celiachia
;  4 pag. elettronico  8 non riscosso DCR SSN
;dalla sesta voce in avanti non coincidono con i valori sotto.
;
;Print!F gestisce da 1 a 30 forme, Print! 3.0 RT solo da 1 a 11.
;Un indice a 0 disabilita quella forma di pagamento.
;
[PAGAMENTI]
contante             = 1
non_riscosso_beni    = 2
assegni              = 3
elettronico          = 4
tickets              = 5
buoni_celiachia      = 6
non_riscosso_servizi = 7
non_riscosso_fattura = 8
non_riscosso_ssn     = 9
sconto_a_pagare      = 10
buoni_multiuso       = 11
; =====================================================================================
; Facile - Sellout Coca Cola: file di configurazione di esempio
;
; Mettere il file nella cartella cfg di Facile e avviare:
;     FacileToWeb.exe -inicocacola.ini -ditta1
; con la cartella di Facile come cartella di lavoro.
;
; Ad ogni avvio scrive il file COCACOLA_AAAAMM.xls con il venduto e i resi dal
; primo del mese a ieri (il primo del mese: il mese precedente completo) e, se
; [FTP] ha un server, lo invia. Si pianifica una volta al giorno.
;
; Prima dell'uso:
;   - [LOGIN]   archivio, utente e password di Facile
;   - [OPTIONS] i codici dei marchi Coca Cola
;   - [FTP]     i dati del server ricevuti dal fornitore; per le prove lasciare
;               server vuoto: il file resta solo nella cartella out
; Le righe che cominciano con ; sono commenti.
; =====================================================================================

[LOGIN]
; server e indirizzo dell'archivio, come nell'accesso a Facile
server            = FAIRCOMS
host              = localhost
arc               = ARCHIVI
; utente di Facile dedicato a FacileToWeb e sua password
usr               = xxxxx
pwd               = yyyyy
; porte: motore SQL dell'archivio e PostgreSQL (questi sono i valori predefiniti)
port              = 6597
pg_port           = 5432

[COMMAND]
; 992 = Sellout Coca Cola
operation         = 992

[OPTIONS]
; codici dei marchi da esportare, separati da virgola (obbligatorio)
marchi            = 12, 15
; cartella del file; vuota = la cartella out di Facile
path              =
; un mese intero da esportare (AAAAMM), per rimandare un mese passato o per una
; prova; vuoto = dal primo del mese a ieri, come nel lavoro di ogni giorno
mese              =

[FTP]
; indirizzo del server; vuoto = nessun invio, il file resta solo in locale
server            =
; sftp (predefinito) oppure ftp
protocol          = sftp
; porta: 22 in sftp, 21 in ftp
port              = 22
; utente e password del server
user              = utente
password          = password
; cartella del server in cui mettere il file; vuota = quella in cui il server fa entrare
directory         =
; solo sftp: impronta della chiave del server, comunicata da chi lo gestisce;
; se indicata, un server con un'impronta diversa viene rifiutato
fingerprint       =
; solo ftp: modalita' passiva
passive           = 1
; 1 = salva nella cartella log il dialogo con il server, per l'assistenza
log               = 0

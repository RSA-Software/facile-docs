; =====================================================================================
; Facile - connettore Shopify: file di configurazione di prova
;
; Mettere il file nella cartella cfg di Facile e avviare:
;     FacileToWeb.exe -inishopify.ini -ditta1
; con la cartella di Facile come cartella di lavoro.
;
; Tutte le operazioni sono accese. Prima dell'uso:
;   - [LOGIN]     archivio, utente e password di Facile
;   - [ECOMMERCE] indirizzo del negozio e token (o client_id e client_secret)
;   - [ARTICOLI]  gli articoli di servizio per spese di trasporto e sconti
;   - [PAGAMENTI] i codici di pagamento di Facile
; e spegnere (0) le operazioni che non servono.
; Le righe che cominciano con ; sono commenti.
; =====================================================================================

[LOGIN]
; server e indirizzo dell'archivio, come nell'accesso a Facile
server            = FAIRCOMS
host              = localhost
arc               = ARCHIVI
; utente di Facile dedicato a FacileToWeb e sua password
usr               = xxxxx
pwd               = yyyyy
; porte: motore SQL dell'archivio e PostgreSQL (questi sono i valori predefiniti)
port              = 6597
pg_port           = 5432

[COMMAND]
; 979 = esecuzione continua: le operazioni accese in [CICLO], poi una pausa, e si ricomincia
operation         = 979
; ordini da rileggere a ogni giro: 1 = ultimo giorno, 2 = 7 giorni, 3 = 31 giorni,
; 4 = dall'inizio dell'esercizio
interval          = 2

[CICLO]
; secondi di attesa fra un giro e l'altro (minimo 10)
pausa             = 300
; 1 = ferma il ciclo; finche' resta a 1 il ciclo non riparte
exit              = 0
; Per ogni operazione: 0 = no, 1 = a ogni giro, N = al massimo una volta ogni N secondi
; (3600 = ogni ora, 86400 = una volta al giorno). Al primo giro partono tutte.
; configurazione del negozio (988): permessi, ubicazione, canale
setup             = 86400
; abbinamento dei prodotti gia' presenti sul negozio (987)
abbina            = 86400
; ordini del negozio -> ordini cliente di Facile (980)
ordini            = 1
; prodotti e collezioni (984)
prodotti          = 3600
; giacenze (982)
giacenze          = 1
; prezzi e promozioni (983)
prezzi            = 1
; listino ingrosso per i professionisti (991), solo con modalita = MISTO
ingrosso          = 3600
; ordini evasi o annullati in Facile -> stato su Shopify (990)
stato_ordini      = 1
; immagini dei prodotti (985): le piu' lente
immagini          = 86400

[ECOMMERCE]
; indirizzo del negozio
web_host          = NOMENEGOZIO.myshopify.com
; versione dei dati di Shopify: si cambia solo insieme a un aggiornamento di Facile
api_version       = 2026-10
; app creata dal Dev Dashboard di Shopify (le app nuove si creano li'): client ID e segreto...
client_id         = CLIENT-ID-DELL-APP
client_secret     = SEGRETO-DELL-APP
; ...oppure app creata dall'amministrazione del negozio prima del 2026: il suo token
; (se c'e' il token, vale il token)
;token            =
; ubicazione Shopify delle giacenze; vuota = la prima attiva
location_name     =
; canale di vendita su cui pubblicare prodotti e collezioni nuovi
canale            = Online Store
; B2C = negozio al pubblico, B2B = solo professionisti, MISTO = tutti e due
modalita          = MISTO
; listino di vendita, listino ufficiale (prezzo barrato se maggiore), listino ingrosso
listino_web       = 1
listino_uff       = 1
listino_ing       = 2
; depositi sommati per le giacenze, separati da virgole
depositi_disp     = 1
; deposito degli ordini importati e delle promozioni dei prezzi
deposito          = 1
; registro degli ordini importati
registro          =
; pagamento e categoria economica dei clienti nuovi creati dagli ordini
pagamento         = 1
cateco            = 0
; cliente degli ordini senza dati personali (piano Basic);
; 0 = il connettore crea un cliente "CLIENTE SHOPIFY" e usa sempre quello
cliente_generico  = 0
; 1 = i prodotti e le collezioni cancellati a mano sul negozio si ricreano
verifica_spariti  = 1
; 1 = la categoria merceologica diventa il tipo di prodotto
tipo_prodotto     = 1
; parole da lasciare maiuscole in categorie, reparti e stagioni
sigle             = USB,LED
; nazione dei testi web; vuota = i testi senza nazione
nazione           =

[ARTICOLI]
; articoli di servizio per le spese di trasporto e lo sconto degli ordini:
; vuoti, spese e sconti non entrano negli ordini
cod_spese_tra     =
cod_buono_sco     =

[STATI]
; stati di pagamento degli ordini da importare (1 = si')
paid              = 1
partially_paid    = 1
authorized        = 1
pending           = 0
partially_refunded = 0
refunded          = 0
voided            = 0
expired           = 0

[PAGAMENTI]
; metodo di pagamento Shopify -> codice pagamento di Facile (pag_ + nome del metodo)
pag_manual        = 1
pag_shopify_payments = 1

[STATO_ORDINI]
; 1 = un ordine evaso in Facile viene evaso anche su Shopify
evaso             = 1
; 1 = un ordine annullato in Facile viene annullato anche su Shopify
;     (merce rimessa a magazzino, NESSUN rimborso automatico)
annullato         = 1
; 1 = Shopify avvisa il cliente per email
avvisa_cliente    = 0

[TAGLIECOL]
; solo versione taglie e colori: nomi delle opzioni sul negozio
opzione_taglia    = Taglia
opzione_colore    = Colore

[DEBUG]
; per le prove e l'assistenza: in uso normale vuote o a 0
codici            =
limite            = 0
log_json          = 0

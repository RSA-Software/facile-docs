;File di configurazione per il tipo cassa "MICRELEC G100"
;Registratori telematici Axon/Micrelec serie G100 pilotati direttamente in rete,
;senza il programma axonFPiD di Micrelec. Serve un firmware G100 recente: la
;lettura della matricola dall'ultimo scontrino c'e' dalla versione G100.127.
;
;Facile parla con il web server del registratore (porta 80): nell'indirizzo va
;solo l'IP, senza la porta. La 9101 e' il protocollo nativo e non si usa.
;Nelle Impostazioni la Porta della cassa va lasciata a un valore diverso da zero
;(per esempio 1): non si usa, ma con zero la vendita non parte.

[OPTIONS]

;Indirizzo IP del registratore
ip = 192.168.1.100

;Porta del web server del registratore
porta = 80

;Attesa massima per un comando, in millisecondi
timeout_ms = 15000

;Attesa massima per i report e la chiusura giornaliera, in millisecondi
timeout_chiusura_ms = 120000

;Colonne di una riga del display della cassa (tipo display "MICRELEC G100")
display_colonne = 20

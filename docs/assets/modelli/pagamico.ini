;File di configurazione della cassa automatica PagAmico in Facile
;
;Facile non parla con la macchina: passa dal FacileWebApiService, configurato in
;Utility > Impostazioni Postazione > Impostazione FacileWebApiService.
;La macchina si configura nel servizio, nel file cfg\casse_automatiche.json.
;
;id_cassa: il numero (Id) che la cassa ha in casse_automatiche.json.
;0, o file assente = la cassa predefinita del servizio.

[OPTIONS]
id_cassa = 0

;File di configurazione per stampante fiscale RCH
;Modelli PRINT!F RT e PRINT! 3.0 RT - protocollo XON/XOFF
;
;Sul registratore il protocollo si abilita in SERVICE, menu Connettivita'.
;La seriale e' fissa a 9600 N 8 1 con flow control XON/XOFF: il cavo e' il
;proprietario CABA0056 (DB9 --> RJ45).

[OPTIONS]

;Solo per il tipo cassa "RCH XON / XOFF LAN" (PRINT! 3.0 RT)
ip   = 192.168.1.100
port = 9100

;Colonne della prima riga di vendita e delle righe di messaggio aggiuntive
COL_PRIMA_RIGA = 24
COL_RIGHE_AGG  = 24

;Tempo di ritardo tra due comandi in millisecondi. Lasciare 0 e alzarlo solo
;se il registratore perde battute o risponde errore 24.
delay_time = 0

;
;Indici delle forme di pagamento.
;
;I valori qui sotto sono i default XML7 del firmware. Vanno cambiati solo se
;sul registratore le forme di pagamento sono state riprogrammate.
;PRINT!F RT accetta da 1 a 30, PRINT! 3.0 RT solo da 1 a 11: un indice oltre
;il massimo gestito fa usare al registratore l' ultima forma disponibile,
;quindi registrerebbe l' incasso sulla forma sbagliata senza dare errore.
;
;Un indice a 0 disabilita quella forma di pagamento.
;
[PAGAMENTI]
contante             = 1
non_riscosso_beni    = 2
assegni              = 3
elettronico          = 4
tickets              = 5
non_riscosso_servizi = 6
non_riscosso_fattura = 7
non_riscosso_ssn     = 8
sconto_a_pagare      = 9
buoni_multiuso       = 10
buoni_celiachia      = 11

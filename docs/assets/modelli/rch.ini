;File di configurazione per stampante fiscale RCH
;Modelli PRINT!F RT e PRINT! 3.0 RT - protocollo XON/XOFF
;
;Sul registratore il protocollo si abilita in SERVICE, menu Connettivita'.
;La seriale e' fissa a 9600 N 8 1 con flow control XON/XOFF: il cavo e' il
;proprietario CABA0056 (DB9 --> RJ45).

[OPTIONS]

;Solo per il tipo cassa "RCH XON / XOFF LAN" (PRINT! 3.0 RT)
ip   = 192.168.1.100
port = 9100

;Colonne della prima riga di vendita e delle righe di messaggio aggiuntive
COL_PRIMA_RIGA = 24
COL_RIGHE_AGG  = 24

;Tempo di ritardo tra due comandi in millisecondi. Lasciare 0 e alzarlo solo
;se il registratore perde battute o risponde errore 24.
delay_time = 0

;--------------------------------------------------------------------------
;OPZIONE FIDELITY del registratore
;--------------------------------------------------------------------------
;Nonostante il nome non gestisce tessere ne' punti, che restano di Facile:
;decide solo se dopo il pagamento la cassa aspetta altre righe prima di
;chiudere lo scontrino. Serve per stampare il codice a barre dello scontrino
;(quello dei resi) in fondo allo scontrino stesso.
;
;Come si accende sulla cassa (Print!F RT, manuale tecnico RCH par. 4.6):
;  5 [CHIAVE], 555 [CONTANTI]        entra in SERVICE (555 = password di fabbrica)
;  [PREZZO REPARTO] piu' volte       fino a OPZIONE FIDELITY, poi [CONTANTI]
;  OPZIONE FIDELITY ?  [REPARTO]     sceglie SI (di fabbrica e' NO), poi [CONTANTI]
;  [STORNO], poi 1 [CHIAVE]          esce dal menu e torna in registrazione
;Per spegnerla si rifa' lo stesso giro scegliendo NO.
;
;Valori. Con questo collegamento Facile non puo' chiedere alla cassa se
;l'opzione e' accesa: il valore qui sotto DEVE corrispondere alla cassa.
;  1 = opzione ACCESA sulla cassa. Dopo il pagamento Facile stampa il codice a
;      barre in fondo allo scontrino e manda la chiusura che la cassa aspetta.
;  0 = opzione SPENTA sulla cassa (come esce di fabbrica). Il codice a barre
;      esce su un documento non fiscale subito dopo lo scontrino.
;Se il valore non corrisponde alla cassa:
;  1 con l'opzione spenta: la cassa rifiuta i comandi mandati dopo il
;    pagamento (lo scontrino e' comunque emesso);
;  0 con l'opzione accesa: Facile non manda la chiusura; sulla Print!F RT la
;    carta viene tagliata subito dopo il pagamento e la parte finale
;    (matricola, azzeramento, numero) resta dentro la stampante senza taglio:
;    si vede solo facendo avanzare la carta.
;Dopo aver acceso o spento l'opzione sulla cassa, cambiare questo valore e
;riaprire il Pos di Facile.
fidelity = 0

;
;Indici delle forme di pagamento.
;
;I valori qui sotto sono i default XML7 del firmware. Vanno cambiati solo se
;sul registratore le forme di pagamento sono state riprogrammate.
;PRINT!F RT accetta da 1 a 30, PRINT! 3.0 RT solo da 1 a 11: un indice oltre
;il massimo gestito fa usare al registratore l' ultima forma disponibile,
;quindi registrerebbe l' incasso sulla forma sbagliata senza dare errore.
;
;Un indice a 0 disabilita quella forma di pagamento.
;
[PAGAMENTI]
contante             = 1
non_riscosso_beni    = 2
assegni              = 3
elettronico          = 4
tickets              = 5
non_riscosso_servizi = 6
non_riscosso_fattura = 7
non_riscosso_ssn     = 8
sconto_a_pagare      = 9
buoni_multiuso       = 10
buoni_celiachia      = 11
